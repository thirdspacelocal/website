# The apex, NOT www: Netlify serves this host and 301s www to it. baseURL is
# what every canonical tag, og:url, JSON-LD url/@id and sitemap <loc> is built
# from, so pointing it at www published a whole site of URLs that redirect --
# a sitemap Search Console flags as "page with redirect", and a
# self-referencing canonical aimed at a redirect, which is a good way to leave
# Google guessing which host to index. Change this only alongside Netlify's
# primary domain setting; the two have to name the same host.
baseURL = "https://thegravitybrewing.com/"
languageCode = "en-us"
title = "Gravity Brewing"
theme = "gravity"
enableRobotsTXT = false  # we ship our own static/robots.txt

# Clean output — no Squarespace-style cruft
disableKinds = ["taxonomy", "term"]

[params]
  description = "Gravity Brewing is Louisville, Colorado's oldest brewery. Award-winning handcrafted ales and lagers, wood-fired sourdough pizza, and a welcoming bier garten on Pine Street."
  tagline = "Louisville's oldest and newest brewery"
  streetAddress = "1150 Pine Street"
  addressLocality = "Louisville"
  addressRegion = "CO"
  postalCode = "80027"
  addressCountry = "US"
  phone = "(303) 544-0746"
  phoneRaw = "+13035440746"
  email = "info@thegravitybrewing.com"
  # WHOLESALE AND DISTRIBUTION ONLY. Named "wholesale", not "sales", because
  # "sales" reads as a catch-all and invited exactly that: the calendar-feeds
  # help text routed broken-website reports here. C.K. sells kegs and cans to
  # bars and shops. He is not the general contact, not the events contact, and
  # not the person to email when a page is broken.
  wholesaleContactName = "C.K. Lichenstein"
  wholesaleEmail = "ck@thegravitybrewing.com"
  # Where a buyout enquiry lands. A ROLE address, not a person: Erin owns this
  # inbox today, and publishing a name means every printed flyer, cached page
  # and forwarded email has to be chased the day that changes. Deliberately
  # separate from wholesaleEmail, which is kegs and cans to the trade.
  bookingEmail = "events@thegravitybrewing.com"
  # approximate coords for Louisville, CO downtown — VERIFY before relying on for maps
  latitude = "39.9783"
  longitude = "-105.1319"

  mapUrl = "https://g.page/GravityBrewing?share"
  foodMenuUrl = "https://doubledspizza.com/menu"

  [params.social]
    facebook = "https://facebook.com/gravitybrewing"
    instagram = "https://instagram.com/thegravitybrewing"
    twitter = "https://twitter.com/gravitybrewing"
    untappd = "https://untappd.com/gravitybrewing"

  # Hours in 24h for JSON-LD openingHoursSpecification; label for display
  [[params.hours]]
    days = "Monday – Thursday"
    display = "3 – 9pm"
    dow = ["Monday", "Tuesday", "Wednesday", "Thursday"]
    opens = "15:00"
    closes = "21:00"
  [[params.hours]]
    days = "Friday"
    display = "3 – 10pm"
    dow = ["Friday"]
    opens = "15:00"
    closes = "22:00"
  [[params.hours]]
    days = "Saturday"
    display = "12 – 10pm"
    dow = ["Saturday"]
    opens = "12:00"
    closes = "22:00"
  [[params.hours]]
    days = "Sunday"
    display = "11 – 7pm"
    dow = ["Sunday"]
    opens = "11:00"
    closes = "19:00"

[menus]
  [[menus.main]]
    name = "Welcome"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "Our Beers"
    pageRef = "/our-beers"
    weight = 2
  [[menus.main]]
    name = "Tasting Room"
    pageRef = "/tasting-room"
    weight = 3
  [[menus.main]]
    name = "Food"
    pageRef = "/food"
    weight = 4
  [[menus.main]]
    name = "Events"
    pageRef = "/events"
    weight = 5
  # Next to Events on purpose: someone who came looking for "what's on" is one
  # thought away from "could we have OUR thing here", and that is the whole
  # journey this page exists to catch.
  [[menus.main]]
    name = "Parties"
    pageRef = "/parties"
    weight = 6
  [[menus.main]]
    name = "About Us"
    pageRef = "/about"
    weight = 7

[markup.goldmark.renderer]
  unsafe = true  # allow inline HTML in content where needed

# The events content adapter reads the Kit feed URL and token from the build
# environment. Hugo's getenv allowlist defaults to HUGO_/CI only, so the KIT_
# pair has to be named explicitly.
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^KIT_EVENTS_']

# Hugo caches remote resources FOREVER by default (maxAge -1), and Netlify
# persists its build cache between deploys -- so without this the events page
# would keep publishing whatever the feed said the first time it was ever
# fetched, and no amount of editing in Kit would change the live site. The feed
# is the one thing that must be fresh on every build.
[caches.getresource]
  dir = ':cacheDir/:project'
  maxAge = 0
