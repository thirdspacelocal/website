{{ define "main" }}
<div class="page-head">
  <div class="wrap">
    {{- with .Params.eyebrow }}<p class="eyebrow">{{ . }}</p>{{ end }}
    <h1>{{ .Title }}</h1>
    {{- with .Params.subtitle }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
</div>

<section>
  <div class="wrap stack">
    {{ .Content }}
  </div>
</section>

{{- if .Params.visit }}
{{- partial "visit.html" . }}
{{- end }}
{{ end }}
