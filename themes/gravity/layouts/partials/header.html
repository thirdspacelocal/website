<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Title }} home">
      {{- with resources.Get "images/logo.png" }}
      <img src="{{ .RelPermalink }}" alt="{{ site.Title }}" width="{{ .Width }}" height="{{ .Height }}">
      {{- end }}
      <span class="brand-name">{{ site.Title }}</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle menu"><span></span></label>
    <nav class="site-nav" aria-label="Primary">
      <ul>
        {{- range site.Menus.main }}
        <li>
          <a href="{{ .URL }}"{{ if .Params.external }} rel="noopener"{{ end }}
             {{ if $.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>{{ .Name }}</a>
        </li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
