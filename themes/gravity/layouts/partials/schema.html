{{- /* Site-wide LocalBusiness / Brewery structured data — the machine-readable core. */ -}}
{{- $p := site.Params -}}
<script type="application/ld+json">
{{- $hours := slice -}}
{{- range $p.hours -}}
  {{- $hours = $hours | append (dict
      "@type" "OpeningHoursSpecification"
      "dayOfWeek" .dow
      "opens" .opens
      "closes" .closes) -}}
{{- end -}}
{{- $sameAs := slice $p.social.facebook $p.social.instagram $p.social.twitter $p.social.untappd -}}
{{- /* Photos + logo — Google's LocalBusiness rich result wants at least one image. */ -}}
{{- $images := slice -}}
{{- range slice "images/taproom-full.jpg" "images/taproom-bar.jpg" "images/taproom-patio.jpg" -}}
  {{- with resources.Get . }}{{ $i := .Fill "1200x800 Center" }}{{ $images = $images | append $i.Permalink }}{{ end -}}
{{- end -}}
{{- $logo := "" -}}
{{- with resources.Get "images/logo.png" }}{{ $logo = .Permalink }}{{ end -}}
{{- /* The owner/operators, who are also the founders of this company.
       The 2026 deal bought the name and the assets, not the seller's company,
       so the organisation described here was founded by Don and Matt. The
       people who started the original brewery are credited in prose on /about;
       naming them in `founder` here would attribute OUR company to them, which
       is the exact confusion this whole page is trying to clear up. */ -}}
{{- $owners := slice -}}
{{- $founders := slice -}}
{{- range site.Data.team.crew -}}
  {{- if eq .title "Owner / Operator" -}}
    {{- $owners = $owners | append (dict "@type" "Person" "name" .name "jobTitle" .title) -}}
    {{- $founders = $founders | append (dict "@type" "Person" "name" .name) -}}
  {{- end -}}
{{- end -}}
{{- $data := dict
    "@context" "https://schema.org"
    "@type" (slice "Brewery" "BarOrPub")
    "@id" (printf "%s#brewery" site.BaseURL)
    "name" site.Title
    "legalName" $p.legalName
    "description" $p.description
    "foundingDate" $p.foundingDate
    "founder" $founders
    "parentOrganization" (dict
      "@type" "Organization"
      "name" $p.parentOrganization)
    "url" site.BaseURL
    "telephone" $p.phone
    "email" $p.email
    "hasMap" $p.mapUrl
    "hasMenu" $p.foodMenuUrl
    "priceRange" "$$"
    "servesCuisine" "Pizza"
    "image" $images
    "logo" $logo
    "address" (dict
      "@type" "PostalAddress"
      "streetAddress" $p.streetAddress
      "addressLocality" $p.addressLocality
      "addressRegion" $p.addressRegion
      "postalCode" $p.postalCode
      "addressCountry" $p.addressCountry)
    "geo" (dict
      "@type" "GeoCoordinates"
      "latitude" $p.latitude
      "longitude" $p.longitude)
    "openingHoursSpecification" $hours
    "sameAs" $sameAs
    "employee" $owners -}}
{{- /* Every page carries the owner/operators, so "who owns Gravity" is answerable
       from any entry point. The About page widens that to the whole crew. */ -}}
{{- if eq .RelPermalink "/about/" -}}
  {{- $t := site.Data.team -}}
  {{- $staff := slice -}}
  {{- range $t.crew }}{{ $staff = $staff | append (dict "@type" "Person" "name" .name "jobTitle" .title) }}{{ end -}}
  {{- $data = merge $data (dict "employee" $staff) -}}
{{- end -}}
{{ $data | jsonify (dict "indent" "  ") | safeJS }}
</script>
