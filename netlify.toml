[build]
  publish = "public"
  # --cleanDestinationDir: a cancelled event must lose its page, not linger
  # at its old URL. Hugo does not remove output for content that vanished.
  command = "hugo --gc --minify --cleanDestinationDir"

[build.environment]
  HUGO_VERSION = "0.164.0"
  HUGO_ENV = "production"

# Long-cache fingerprinted assets (Hugo fingerprints CSS + processed images)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
