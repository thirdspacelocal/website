# Gravity's five core values — the public-facing phrasing of what we stand for.
# Rendered on /about.

- title: Build the third place
  body: >-
    Before we're a brewery or a bar, we're the place: the spot between home and work
    where the neighborhood gathers. If a choice makes us more profitable but less
    welcoming, it's the wrong choice.

- title: Open by default
  body: >-
    We share freely: what's working, what we're trying, what we'd do differently next
    time. No gatekeeping, no silos, no "not my department."

- title: Play, as a team
  body: >-
    Have fun, and do it together. We cover for each other without being asked, and hold
    high standards with care instead of criticism.

- title: Craft the change you seek
  body: >-
    If something isn't good enough, whether a recipe, a process, or a wobbly table, it's
    ours to fix. The quality of everything that leaves the building is everyone's job.

- title: Make room at the table
  body: >-
    We widen the circle on purpose. Your job is the person who isn't already taken care
    of: the newcomer, the one sitting alone. There's always room for one more.
