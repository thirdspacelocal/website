# The people of Gravity Brewing. Grouped and rendered on /about.
# The crew (the team you'll actually meet) leads; the owner/operators follow;
# the original founders get a brief credit line, not cards.

crew:
  - name: Scott Smith
    title: Head Brewer
    image: images/team-scott-smith.jpg
    bio: >-
      Scott came to Gravity from San Diego, with years in that city's craft market as
      Production Manager at Thorn Brewing, Head Brewer at Thorn Street Brewery, and most
      recently at Green Flash / Alpine Beer. Early on he helped run Ballast Point's Home
      Brew Mart, which gave him a deep appreciation for the raw materials that make great
      beer. He runs our brewhouse today.

  - name: C.K. Lichenstein
    title: Sales Manager
    image: images/team-ck-lichenstein.jpg
    bio: >-
      CK has been involved in craft beer for way longer than he'd care to admit. He got
      his start volunteering at beer festivals around Portland, then moved into sales. He's
      worked the craft scene from Free the Hops and The J. Clyde Gastropub to Yellowhammer
      Brewing and the Alabama Brewers Guild. Since joining Gravity in 2023 he's grown from
      Sales Representative to Sales Manager, and he's still constantly trying new styles,
      beers and breweries.

  - name: Justin Prosolow
    title: Bartender
    image: images/team-justin-prosolow.jpg

  - name: Sean Stewart
    title: Bartender
    image: images/team-sean-stewart.jpg

  - name: Coleridge Gollata
    title: Delivery & Bartender
    image: images/team-coleridge-gollata.jpg

  - name: Michaela Murphy
    title: Bartender
    image: images/team-michaela-murphy.jpg

  - name: Ashley Luke
    title: Bartender
    image: images/team-ashley-luke.jpg

  - name: Julie Brown
    title: Financial Controller
    image: images/team-julie-brown.jpg

  - name: Matt Gorbsky
    title: Owner / Operator
    image: images/team-matt-gorbsky.jpeg
    bio: >-
      Matt is a home brewer at heart who took the leap to the other side of the bar. His
      background is in software too (he leads product at Broadcom), but his real happy
      place is next to a fermenter. He joined Don as co-owner in 2026.

  - name: Don Brown
    title: Owner / Operator
    image: images/team-don-brown.jpg
    bio: >-
      Don has called Louisville home since 2012, and also runs Hana Studios just up the
      street downtown. His background is in software, a career spent building startups, and
      he took the reins at Gravity in 2026 on a simple bet: that a great neighborhood
      brewery is really about the table you pull up to.

founders:
  - name: John Frazee
    image: images/team-john-frazee.png
    bio: >-
      John caught the craft beer bug while studying engineering at CU Boulder. With a nudge
      from his older brother and Colorado's Front Range scene, he turned a longtime
      home-brewing hobby into Gravity Brewing, opening the doors in 2012.

  - name: Ryan Bowers
    image: images/team-ryan-bowers.png
    bio: >-
      Ryan brought a background in mechanical and process engineering to the science and
      craft of brewing, shaped like John by the Boulder and Denver beer scene.

# Bartenders who have moved on. Rendered small: a face, a name, the job they
# did and the years they did it. No bio. `image` may point at a file that does
# not exist yet -- the layout falls back to initials, so a photo can be dropped
# in later and will appear with no other change. `title` and `years` are both
# optional and each is skipped on its own if absent.
alumni:
