- name: John Frazee
  title: Founder / Brewer
  image: images/team-john-frazee.png
  bio: >-
    John fell in love with the craft beer movement while studying engineering at the
    University of Colorado at Boulder. Thanks to some inspiration from his older brother
    and the influence of the vibrant craft beer scene on Colorado's front range, John
    turned his longtime home brewing hobby into a business. His passion and devotion to
    craft beer and brewing has never wavered. (Pictured w/ Shannon & Kristy Frazee)

- name: Ryan Bowers
  title: Managing Partner
  image: images/team-ryan-bowers.png
  bio: >-
    Ryan has extensive knowledge of and a great passion for mechanical and process
    engineering, which is directly applicable to the science and art of brewing. While
    attending the University of Colorado at Boulder, Ryan was, like John, greatly
    influenced by the exciting craft beer scene in Boulder and Denver.

- name: Scott Smith
  title: Head Brewer
  image: images/team-scott-smith.jpg
  bio: >-
    Scott comes to Gravity Brewing from San Diego, California. Scott has several years of
    experience in the San Diego craft beer market as the Production Manager at Thorn
    Brewing, Head Brewer at Thorn Street Brewery and most recently brewing at Green
    Flash/Alpine Beer. Early in Scott's career he helped manage Ballast Point's Home Brew
    Mart which gave him a wide knowledge and appreciation for the raw materials used to
    make beer.

- name: C.K. Lichenstein
  title: Wholesale Sales Manager
  image: images/team-ck-lichenstein.jpg
  bio: >-
    CK has been involved in craft beer for way longer than he would care to admit, first
    volunteering for beer festivals in and around Portland Oregon, and then later into
    sales. After moving to Alabama to take care of family, he began working in the craft
    beer scene for Free the Hops, The J. Clyde Gastropub, Yellowhammer Brewing and then
    finally the Alabama Brewers Guild. He has a lot of sales experience but, even more
    importantly, he genuinely loves craft beer and is constantly trying new styles, beers
    and breweries. Since starting at Gravity in April 2023, he has been promoted to Sales
    Manager from Sales Representative and continually increases outside sales and our
    market presence.
